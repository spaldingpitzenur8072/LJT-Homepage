name: Verify site build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Check built pages
        run: |
          echo "Publication links on publications page:"
          grep -o 'class="archive__item-title"' _site/publications/index.html | wc -l
          echo "About page personal details:"
          for text in "Junteng Liu" "HKUST NLP Group" "Ph.D. in Computer Science" "B.Eng." "Shanghai Jiao Tong University" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Zhiyuan Honor Scholarship" "Natural Language Processing" "Machine Learning" "jliugi@connect.ust.hk" "Vicent0205" "junteng88716710" "tbK9jl4AAAAJ"; do
            grep -q "$text" _site/index.html && echo "OK: $text"
          done
          echo "Leftover template content (should be empty):"
          grep -Elo 'Your Name|GitHub University|Paper Title Number|blog-post|Skill 1' _site/index.html _site/cv/index.html _site/publications/index.html || true
          echo "Sidebar avatar rendered (should be empty):"
          grep -o 'author__avatar' _site/index.html || true
      - name: Publish built site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

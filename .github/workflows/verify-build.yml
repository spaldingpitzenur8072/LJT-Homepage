name: Verify site build

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Check built pages
        run: |
          echo "Publication entries: $(grep -o 'archive__item-title' _site/publications/index.html | wc -l)"
          for text in "Junteng Liu" "HKUST NLP Group" "Ph.D. in Computer Science" "B.Eng." "Shanghai Jiao Tong University" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Zhiyuan Honor Scholarship" "Natural Language Processing" "Machine Learning" "jliugi@connect.ust.hk" "Vicent0205" "junteng88716710" "tbK9jl4AAAAJ"; do
            grep -q "$text" _site/index.html && echo "OK: $text"
          done
          echo "Leftover template content (should be empty):"
          grep -Elo 'Your Name|GitHub University|Paper Title Number|Skill 1' _site/index.html _site/cv/index.html _site/publications/index.html || true
          echo "Sidebar avatar (should be empty):"
          grep -o 'author__avatar' _site/index.html || true
      - name: Inspect Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6
      - name: Report Pages configuration
        run: |
          echo "Pages configuration outcome: ${{ steps.pages.outcome }}"
          echo "Pages base path: ${{ steps.pages.outputs.base_path }}"
